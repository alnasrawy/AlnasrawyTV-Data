name: Daily Trial

# One live end-to-end smoke every day (15:00 Baghdad = 12:00 UTC).
# No config secrets yet? The job exits 0 with a friendly message.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily trial
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python main.py --trial