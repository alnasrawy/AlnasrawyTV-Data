name: Auto Daily Movies & Series Fetcher

on:
  schedule:
    # يشتغل تلقائياً كل يوم الساعة 12 منتصف الليل (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر في أي وقت

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Movies Fetcher
      run: python fetch_movies.py

    - name: Run Series Fetcher
      run: python fetch_series.py

    - name: Commit and Push Updated JSON Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add movies.json series.json
        git commit -m "Auto-update: Daily VOD Library Expansion" || exit 0
        git push
