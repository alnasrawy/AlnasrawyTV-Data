name: Update Matches Data Automatically
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Dependencies
        run: pip install requests
      - name: Run Fetch Script
        run: python fetch_matches.py
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Bot"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Updates: Live Scores & Leagues Cleaned" && git push)
