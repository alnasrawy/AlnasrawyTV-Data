name: Alnasrawy TV Matches Smart-Sync (Accuracy Mode)

on:
  schedule:
    # 🌙 1. جلب قائمة اليوم الجديد (12:00 بتوقيت مكة/العراق = 21:00 UTC)
    - cron: '0 21 * * *'

    # 🔥 2. فحص متكرر كل 5 دقائق على مدار اليوم.
    #    المستودع عام → دقائق GitHub Actions مجانية وغير محدودة، فالعمل بلا
    #    توفير رصيد: كل تذكير بدء / تحديث مباشر / نتيجة نهائية يُرسل عند أقرب
    #    دورة. الحمايات (started_notified/ended_notified) تمنع التكرار،
    #    وتهنئة التفاصيل انتقائية فقط (مباشر/منتهٍ معلّق/قريب) فلا إغراق للمصدر.
    - cron: '*/5 * * * *'

  workflow_dispatch: # متاح للتشغيل اليدوي للطوارئ

  # أي تعديل على الكود يشغّل دورة فوراً (bounded to code files so the bot's
  # own data-commits never retrigger a cycle)
  push:
    branches: [main]
    paths:
      - 'fetch_matches.py'
      - '.github/workflows/matches.yml'

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Arabic Fonts
        # 💡 خط Tajawal يُحمَّل مسبقاً (مضمون) حتى لا يسقط سكربت الرسم على خط بدون عربية
        run: |
          mkdir -p /tmp/alnasrawy_fonts
          curl -fsSL -o /tmp/alnasrawy_fonts/tajawal_regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf"
          curl -fsSL -o /tmp/alnasrawy_fonts/tajawal_bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf"
          ls -la /tmp/alnasrawy_fonts

      - name: Install Dependencies
        # 👈 مكتبة التخفي + مكتبات رسم بطاقة المباراة (Pillow + العربية)
        run: pip install curl_cffi beautifulsoup4 pillow arabic-reshaper python-bidi

      - name: Run Scraper
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python fetch_matches.py

      - name: Auto-Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Alnasrawy Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "⚽ Match Data Updated [$(date)]"
            git push
          fi
