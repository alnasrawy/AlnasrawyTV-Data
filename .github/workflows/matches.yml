name: Alnasrawy TV Matches Smart-Sync (Credit Saver)

on:
  schedule:
    # 🌙 1. جلب قائمة اليوم الجديد (12:00 فجراً بتوقيت العراق / 9:00 مساءً UTC)
    - cron: '0 21 * * *'
    
    # 🔥 2. تحديثات النتائج اللحظية كل 10 دقائق (من 2:00 ظهراً حتى 1:00 فجراً بتوقيت العراق)
    # تقابلها من 11:00 صباحاً حتى 10:00 مساءً بتوقيت UTC
    - cron: '*/10 11-22 * * *'
    
  workflow_dispatch: # متاح للتشغيل اليدوي للطوارئ

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run Scraper
        run: python fetch_matches.py
        
      - name: Auto-Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Alnasrawy Bot"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚽ Match Data Updated [$(date)]" && git push)
