name: Alnasrawy TV Matches Auto-Sync

on:
  schedule:
    # تحديث كل 5 دقائق خلال وقت المباريات (من 11 صباحاً حتى 11 مساءً UTC)
    # يقابلها من 2 ظهراً حتى 2 بعد منتصف الليل بتوقيت العراق
    - cron: '*/5 11-23 * * *'
    
    # تحديث كل ساعة في بقية اليوم للحفاظ على الهدوء
    - cron: '0 0-10 * * *'
    
  workflow_dispatch: # يسمح لك بتشغيل التحديث يدوياً

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Requirements
        run: pip install requests beautifulsoup4
        
      - name: Run Scraper
        run: python fetch_matches.py
        
      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚽ Live Score Update: $(date)" && git push)
