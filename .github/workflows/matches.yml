name: Update Matches Data Automatically

on:
  schedule:
    # التحديث التلقائي كل 30 دقيقة
    - cron: '*/30 * * * *'
  workflow_dispatch: # يتيح لك تشغيل التحديث يدوياً من GitHub في أي وقت

# ⚠️ هذه الصلاحية هي السر وراء نجاح البوت في حفظ التعديلات ورفعها للمستودع
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Fetch Script
        run: python fetch_matches.py

      - name: Commit and Push Updated matches.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches.json [skip ci]" && git push)
