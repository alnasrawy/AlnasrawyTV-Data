name: Alnasrawy TV Matches Smart-Sync (Credit Saver)

on:
  schedule:
    # 🌙 1. جلب قائمة اليوم الجديد (12:00 فجراً بتوقيت العراق / 9:00 مساءً UTC)
    - cron: '0 21 * * *'

    # 🔥 2. تحديثات النتائج اللحظية كل 10 دقائق (من 2:00 ظهراً حتى 1:00 فجراً بتوقيت العراق)
    # تقابلها من 11:00 صباحاً حتى 10:00 مساءً بتوقيت UTC
    - cron: '*/10 11-22 * * *'

  workflow_dispatch: # متاح للتشغيل اليدوي للطوارئ

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Arabic Fonts
        # 💡 خط Tajawal يُحمَّل مسبقاً (مضمون) حتى لا يسقط سكربت الرسم على خط بدون عربية
        run: |
          mkdir -p /tmp/alnasrawy_fonts
          curl -fsSL -o /tmp/alnasrawy_fonts/tajawal_regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf"
          curl -fsSL -o /tmp/alnasrawy_fonts/tajawal_bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf"
          ls -la /tmp/alnasrawy_fonts

      - name: Install Dependencies
        # 👈 مكتبة التخفي + مكتبات رسم بطاقة المباراة (Pillow + العربية)
        run: pip install curl_cffi beautifulsoup4 pillow arabic-reshaper python-bidi

      - name: Run Scraper
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        working-directory: matches_data
        run: python fetch_matches.py

      - name: Auto-Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Alnasrawy Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "⚽ Match Data Updated [$(date)]"
            git push
          fi