name: Update Daily Matches

on:
  schedule:
    # يعمل تلقائياً عند بداية كل يوم (الساعة 12:00 صباحاً بتوقيت مكة)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-matches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Fetch Matches Script
      run: python fetch_matches.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add matches.json
        git diff-index --quiet HEAD || git commit -m "Automated update: matches.json with commentators [skip ci]"
        git push
