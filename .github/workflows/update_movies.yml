name: Update Movies Data

on:
  schedule:
    - cron: '0 */6 * * *'  # تشغيل تلقائي كل 6 ساعات
  workflow_dispatch:        # إمكانية التشغيل اليدوي بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: python fetch_movies.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: movies.json [skip ci]" && git push)
